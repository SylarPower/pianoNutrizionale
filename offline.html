<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano Nutrizionale — offline</title>
  <meta name="theme-color" content="#3d9970">
  <style>
    /* Pagina offline: stesso design system dell'app (font Author, palette e
       scala di misura condivisi con css/style.css). */
    @font-face {
      font-family: "Author";
      font-style: normal;
      font-weight: 300 800;
      font-display: swap;
      src: url("assets/fonts/Author-Variable.woff2") format("woff2");
    }
    :root {
      --bg: #fbf6f0;
      --surface: #ffffff;
      --text: #2d3436;
      --text-muted: #6b7b7d;
      --line: #eadfd2;
      --primary: #3d9970;
      --primary-strong: #2f7a59;
      --shadow: 0 2px 8px rgba(45, 52, 54, 0.06), 0 12px 32px rgba(45, 52, 54, 0.08);
      --font-display: "Author", Verdana, "SF Pro Display", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Author", Verdana, ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      line-height: 1.5;
      letter-spacing: .25px;
      padding: 24px;
    }
    .card {
      width: min(100%, 420px);
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: center;
    }
    .card .logo { width: 56px; height: 56px; margin: 0 auto 16px; display: block; }
    h1 {
      font-family: var(--font-display);
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: -.025em;
      line-height: 1.2;
      margin: 0 0 8px;
    }
    p { color: var(--text-muted); font-size: 1rem; line-height: 1.5; margin: 0 0 24px; }
    button {
      min-height: 44px;
      padding: 8px 16px;
      border: 0;
      border-radius: 11px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 1.25px;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: var(--primary-strong); }
    @media (prefers-color-scheme: dark) {
      body { background: #000; color: #fff; }
      .card { background: #000; border-color: #202020; box-shadow: none; }
      p { color: #a3a3a3; }
      button { background: #7dddb2; color: #04120b; }
      button:hover { background: #93e6c2; }
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/loghi/logo-app.svg" alt="">
    <h1>Sei offline</h1>
    <p>La connessione non è disponibile in questo momento. Se hai già effettuato l’accesso in precedenza, i dati salvati localmente restano consultabili; riconnettiti per sincronizzare le modifiche.</p>
    <button type="button" onclick="window.location.reload()">Riprova</button>
  </div>
</body>
</html>
