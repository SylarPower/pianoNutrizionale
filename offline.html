<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano Nutrizionale — offline</title>
  <meta name="theme-color" content="#245a43">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f8f9fa;
      color: #1a1a1a;
    }
    .card {
      max-width: 420px;
      margin: 20px;
      padding: 28px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid #e2e2e2;
      text-align: center;
    }
    .emoji { font-size: 44px; }
    h1 { font-size: 1.3rem; margin: 14px 0 8px; }
    p { color: #5c5c5c; font-size: .95rem; line-height: 1.5; margin: 0 0 18px; }
    button {
      min-height: 46px;
      padding: 10px 22px;
      border: 0;
      border-radius: 12px;
      background: #245a43;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #000; color: #fff; }
      .card { background: #0d0d0d; border-color: #232323; }
      p { color: #9a9a9a; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🥗</div>
    <h1>Sei offline</h1>
    <p>La connessione non è disponibile in questo momento. Se hai già effettuato l'accesso in precedenza, i dati salvati localmente restano consultabili; riconnettiti per sincronizzare le modifiche.</p>
    <button type="button" onclick="window.location.reload()">Riprova</button>
  </div>
</body>
</html>
